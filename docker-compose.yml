services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: doyousend
      POSTGRES_PASSWORD: doyousend
      POSTGRES_DB: doyousend
    ports: ["5432:5432"]
    volumes: ["dbdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doyousend"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  # Atrapa serwera SMTP: przechwytuje wszystkie e-maile, nic nie wychodzi na zewnatrz.
  # UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]

volumes:
  dbdata:
