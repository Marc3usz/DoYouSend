# Kontrakt miedzy backendem (Go) a frontendem (SvelteKit).
# PLIK WSPOLNY: zmiana kontraktu idzie osobnym, malym PR-em i jest ogloszona zespolowi.
# Szkielet z M1 - endpointy dochodza wraz z implementacja domen.
openapi: 3.0.3
info:
  title: DoYouSend API
  version: 0.1.0
  description: |
    Komunikaty e-mail i SMS. Zasada nadrzedna: tresc e-maila i SMS-a dla danego odbiorcy
    jest identyczna; temat dotyczy wylacznie e-maila.
servers:
  - url: http://localhost:8080/api

tags:
  - name: recipients   # DEV A
  - name: groups       # DEV A
  - name: messages     # DEV B
  - name: batches      # DEV B
  - name: admin        # DEV C
  - name: auth         # DEV C

paths:
  /healthz:
    get:
      summary: Stan uslugi
      responses:
        "200": { description: OK }

  /recipients:
    get:
      tags: [recipients]
      summary: Lista odbiorcow
      parameters:
        - { in: query, name: q,    schema: { type: string } }
        - { in: query, name: type, schema: { $ref: "#/components/schemas/RecipientType" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Recipient" }
    post:
      tags: [recipients]
      summary: Dodaje odbiorce
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecipientInput" }
      responses:
        "201": { description: Utworzono }
        "409": { description: Duplikat e-maila lub numeru }

  /recipients/import:
    post:
      tags: [recipients]
      summary: Import z pliku CSV lub XLSX
      description: |
        Zapisuje wiersze poprawne (wszystkie albo zaden) i zwraca raport per wiersz.
        Wymaga roli administratora. Jeszcze niezaimplementowany: czeka na baze
        (platform/database) i middleware rol (iam).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/ImportFile" }
      responses:
        "200":
          description: Raport importu; valid to wiersze zapisane
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportReport" }
        "400": { $ref: "#/components/responses/ImportFileError" }
        "413": { $ref: "#/components/responses/ImportFileError" }
        "422": { $ref: "#/components/responses/ImportFileError" }

  /recipients/import/check:
    post:
      tags: [recipients]
      summary: Sprawdza plik importu bez zapisu (podglad)
      description: |
        Ten sam raport co /recipients/import, ale nic nie zapisuje. Dopoki nie ma bazy,
        duplikaty sa wykrywane tylko w obrebie pliku, a endpoint nie wymaga logowania
        (zwraca wylacznie dane z przeslanego pliku). Po podlaczeniu bazy sprawdza tez
        duplikaty wzgledem zapisanych odbiorcow i od tej chwili wymaga roli administratora.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/ImportFile" }
      responses:
        "200":
          description: Raport per wiersz
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportReport" }
        "400": { $ref: "#/components/responses/ImportFileError" }
        "413": { $ref: "#/components/responses/ImportFileError" }
        "422": { $ref: "#/components/responses/ImportFileError" }

  /groups:
    get:
      tags: [groups]
      summary: Lista grup
      responses:
        "200": { description: OK }

  /groups/resolve:
    post:
      tags: [groups]
      summary: Rozwija wybor grup i osob do finalnej listy odbiorcow
      description: |
        Wynik jest zdeduplikowany: osoba wybrana przez kilka grup wystepuje raz.
        Odbiorcy bez kompletu danych sa oznaczeni w polu missing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecipientSelection" }
      responses:
        "200": { description: Lista odbiorcow z oznaczeniem brakow }

  /messages/preview:
    post:
      tags: [messages]
      summary: Podsumowanie przed zatwierdzeniem
      description: Dlugosc tresci, liczba czesci SMS na odbiorce, liczba odbiorcow, laczna liczba SMS, koszt.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageDraft" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SendEstimate" }

  /batches:
    get:
      tags: [batches]
      summary: Historia wysylek
      responses:
        "200": { description: OK }
    post:
      tags: [batches]
      summary: Tworzy wsad (draft)
      responses:
        "201": { description: Utworzono }

  /batches/{id}/confirm:
    post:
      tags: [batches]
      summary: Zatwierdza i uruchamia wysylke
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "202": { description: Wysylka uruchomiona }

  /batches/{id}/deliveries:
    get:
      tags: [batches]
      summary: Statusy obu kanalow dla kazdego odbiorcy
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK }

  /batches/{id}/retry:
    post:
      tags: [batches]
      summary: Ponawia nieudane wiadomosci we wsadzie
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "202": { description: Ponowienie uruchomione }

components:
  schemas:
    RecipientType:
      type: string
      enum: [parent, student]

    Recipient:
      type: object
      required: [id, firstName, lastName, type]
      properties:
        id:        { type: string, format: uuid }
        firstName: { type: string }
        lastName:  { type: string }
        email:     { type: string, nullable: true }
        phone:     { type: string, nullable: true, description: "E.164" }
        type:      { $ref: "#/components/schemas/RecipientType" }
        groupIds:
          type: array
          items: { type: string, format: uuid }

    RecipientInput:
      allOf:
        - $ref: "#/components/schemas/Recipient"

    RecipientSelection:
      type: object
      properties:
        groupIds:
          type: array
          items: { type: string, format: uuid }
        recipientIds:
          type: array
          items: { type: string, format: uuid }

    MessageDraft:
      type: object
      required: [subject, body, selection]
      properties:
        subject: { type: string, description: "Wylacznie temat e-maila" }
        body:    { type: string, description: "Jedna wspolna tresc dla obu kanalow" }
        selection: { $ref: "#/components/schemas/RecipientSelection" }

    SendEstimate:
      type: object
      properties:
        bodyLength:     { type: integer }
        encoding:       { type: string, enum: [GSM7, UCS2] }
        partsPerRecipient: { type: integer }
        recipientCount: { type: integer }
        totalSmsParts:  { type: integer }
        estimatedCost:  { type: number, format: double }
        missingEmail:
          type: array
          items: { $ref: "#/components/schemas/Recipient" }
        missingPhone:
          type: array
          items: { $ref: "#/components/schemas/Recipient" }

    ImportFile:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: CSV (UTF-8, separator , albo ;) lub XLSX (pierwszy arkusz), najwyzej 5 MB i 5000 wierszy

    ImportReport:
      type: object
      description: Kazdy niepusty wiersz danych jest dokladnie na jednej liscie. row to numer wiersza w pliku (naglowek = 1).
      required: [valid, invalid, duplicates]
      properties:
        valid:
          type: array
          items:
            type: object
            required: [row, recipient]
            properties:
              row:       { type: integer }
              recipient: { $ref: "#/components/schemas/ImportedRecipient" }
        invalid:
          type: array
          items:
            type: object
            required: [row, errors]
            properties:
              row: { type: integer }
              errors:
                type: array
                items: { $ref: "#/components/schemas/ImportFieldError" }
        duplicates:
          type: array
          items:
            type: object
            required: [row, field]
            description: Dokladnie jedno z duplicateOfRow / existingRecipientId jest ustawione.
            properties:
              row:   { type: integer }
              field: { type: string, enum: [email, phone] }
              duplicateOfRow:      { type: integer, description: "Wczesniejszy wiersz pliku z ta sama wartoscia" }
              existingRecipientId: { type: string, format: uuid, description: "Zapisany odbiorca z ta sama wartoscia" }

    ImportedRecipient:
      type: object
      required: [firstName, lastName, type]
      properties:
        firstName: { type: string }
        lastName:  { type: string }
        email:     { type: string, nullable: true }
        phone:     { type: string, nullable: true, description: "E.164" }
        type:      { $ref: "#/components/schemas/RecipientType" }

    ImportFieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          enum: [first_name, last_name, type, email, phone, contact, encoding, row]
          description: Stabilny klucz dla UI (contact = brak e-maila i telefonu, row = wiersza nie da sie odczytac)
        message: { type: string, description: "Szczegol diagnostyczny po angielsku, nie do wyswietlania wprost" }

    ImportFileErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [invalid_request, missing_file, empty_file, missing_columns, invalid_header, unsupported_format, file_too_large, too_many_rows, unclosed_quote]
        message: { type: string, description: "Szczegol diagnostyczny po angielsku, np. lista brakujacych kolumn" }

  responses:
    ImportFileError:
      description: |
        Pliku nie da sie uzyc jako calosci (pojedyncze zle wiersze trafiaja do raportu, nie tutaj).
        400 = invalid_request (to nie multipart) albo missing_file (brak pola file),
        413 = file_too_large, 422 = pozostale kody.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ImportFileErrorBody" }
