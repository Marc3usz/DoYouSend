# Kontrakt miedzy backendem (Go) a frontendem (SvelteKit).
# PLIK WSPOLNY: zmiana kontraktu idzie osobnym, malym PR-em i jest ogloszona zespolowi.
# Szkielet z M1 - endpointy dochodza wraz z implementacja domen.
openapi: 3.0.3
info:
  title: DoYouSend API
  version: 0.1.0
  description: |
    Komunikaty e-mail i SMS. Zasada nadrzedna: tresc e-maila i SMS-a dla danego odbiorcy
    jest identyczna; temat dotyczy wylacznie e-maila.
servers:
  - url: http://localhost:8080/api

tags:
  - name: recipients   # DEV A
  - name: groups       # DEV A
  - name: messages     # DEV B
  - name: batches      # DEV B
  - name: admin        # DEV D
  - name: auth         # DEV D

# Kazdy endpoint wymaga zalogowania (cookie sesji), o ile nie ma "security: []".
# Ktora rola moze co: backend/internal/iam/policy.go (ADR-0010). Brak sesji -> 401
# unauthenticated, zla rola -> 403 forbidden.
security:
  - sessionCookie: []

paths:
  /healthz:
    get:
      summary: Stan uslugi
      security: []
      responses:
        "200": { description: OK }

  /recipients:
    get:
      tags: [recipients]
      summary: Lista odbiorcow (stronicowana)
      description: |
        Posortowana po nazwisku, imieniu i ID. Wymaga roli administratora.
      parameters:
        - in: query
          name: q
          description: Fragment imienia, nazwiska, e-maila lub numeru (bez wzgledu na wielkosc liter)
          schema: { type: string, maxLength: 100 }
        - { in: query, name: type, schema: { $ref: "#/components/schemas/RecipientType" } }
        - in: query
          name: class
          description: Tylko odbiorcy przypisani do tej klasy (normalizowana jak ClassName, np. "3 a" = 3A; ADR-0009)
          schema: { $ref: "#/components/schemas/ClassName" }
        - in: query
          name: issue
          description: Tylko odbiorcy z problemem danych kontaktowych w danym kanale
          schema: { $ref: "#/components/schemas/Channel" }
        - { in: query, name: limit,  schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecipientPage" }
        "400": { $ref: "#/components/responses/Error" }
    post:
      tags: [recipients]
      summary: Dodaje odbiorce
      description: Telefon jest normalizowany do E.164 (np. "500 100 101" -> "+48500100101").
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecipientInput" }
      responses:
        "201":
          description: Utworzono
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recipient" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /recipients/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [recipients]
      summary: Jeden odbiorca, z grupami wlasnymi, do ktorych nalezy
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recipient" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [recipients]
      summary: Zmienia dane odbiorcy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecipientInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recipient" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [recipients]
      summary: Usuwa odbiorce
      description: |
        Odbiorcy, ktory wystepuje w historii wysylek (batch_recipients), nie da sie usunac:
        409 z kodem recipient_in_use. Historia musi pokazywac, do kogo poszla wiadomosc.
      responses:
        "204": { description: Usunieto }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /recipients/import:
    post:
      tags: [recipients]
      summary: Import z pliku CSV lub XLSX
      description: |
        Zapisuje wiersze poprawne (wszystkie albo zaden) i zwraca raport per wiersz;
        valid to wiersze faktycznie zapisane. Bledne wiersze i duplikaty (w pliku i wzgledem
        zapisanych odbiorcow) sa pomijane. Kontakt zapisany rownolegle przez kogos innego
        trafia do duplicates zamiast przerywac import. Wymaga roli administratora.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/ImportFile" }
      responses:
        "200":
          description: Raport importu; valid to wiersze zapisane
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportReport" }
        "400": { $ref: "#/components/responses/ImportFileError" }
        "413": { $ref: "#/components/responses/ImportFileError" }
        "422": { $ref: "#/components/responses/ImportFileError" }
        "500": { $ref: "#/components/responses/ImportFileError" }

  /recipients/import/check:
    post:
      tags: [recipients]
      summary: Sprawdza plik importu bez zapisu (podglad)
      description: |
        Ten sam raport co /recipients/import, ale nic nie zapisuje. Dopoki nie ma bazy,
        duplikaty sa wykrywane tylko w obrebie pliku, a endpoint nie wymaga logowania
        (zwraca wylacznie dane z przeslanego pliku). Po podlaczeniu bazy sprawdza tez
        duplikaty wzgledem zapisanych odbiorcow i od tej chwili wymaga roli administratora.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/ImportFile" }
      responses:
        "200":
          description: Raport per wiersz
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportReport" }
        "400": { $ref: "#/components/responses/ImportFileError" }
        "413": { $ref: "#/components/responses/ImportFileError" }
        "422": { $ref: "#/components/responses/ImportFileError" }

  /groups:
    get:
      tags: [groups]
      summary: Lista grup
      description: |
        Kolejnosc (ADR-0009): "Wszyscy rodzice", "Wszyscy uczniowie"; potem grupy klasowe
        posortowane po numerze klasy liczbowo, nastepnie po reszcie nazwy (1A, 1B, 2A, ..., 10A),
        w kazdej klasie najpierw uczniowie, potem rodzice; na koncu grupy wlasne po nazwie.
        Grupa klasowa jest na liscie, dopoki w klasie jest co najmniej jeden odbiorca.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Group" }
    post:
      tags: [groups]
      summary: Tworzy grupe wlasna
      description: Nazwy porownywane bez wzgledu na wielkosc liter i spacje; nazwy grup systemowych sa zarezerwowane.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupInput" }
      responses:
        "201":
          description: Utworzono
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /groups/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [groups]
      summary: Jedna grupa (systemowa albo wlasna)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [groups]
      summary: Zmienia nazwe lub opis grupy wlasnej
      description: Grupa systemowa -> 409 z kodem system_group.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [groups]
      summary: Usuwa grupe wlasna
      description: Czlonkowie zostaja w bazie odbiorcow, znika tylko przynaleznosc.
      responses:
        "204": { description: Usunieto }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /groups/{id}/members:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [groups]
      summary: Czlonkowie grupy, po nazwisku i imieniu
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Recipient" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [groups]
      summary: Dodaje odbiorcow do grupy wlasnej
      description: |
        Wszystko albo nic: jesli ktores ID nie istnieje, nic nie jest dodane, a odpowiedz
        422 (unknown_recipient) wymienia je w polu ids. Osoby juz nalezace do grupy
        licza sie jako unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberIds" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipChange" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /groups/{id}/members/remove:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [groups]
      summary: Usuwa odbiorcow z grupy wlasnej
      description: POST zamiast DELETE z body, bo czesc klientow i proxy gubi body DELETE-a.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberIds" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipChange" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /groups/resolve:
    post:
      tags: [groups]
      summary: Rozwija wybor grup i osob do finalnej listy odbiorcow
      description: |
        Ksztalt wg ADR-0007 (status: propozycja). Wynik jest zdeduplikowany: osoba wybrana
        przez kilka grup wystepuje raz. Braki danych kontaktowych sa raportowane w issues,
        nie filtrowane - decyzje (poprawic, wykluczyc, wyslac czesciowo) podejmuje wysylajacy.
        Nieistniejace ID nie sa bledem, tylko trafiaja do unknownGroupIds / unknownRecipientIds.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecipientSelection" }
      responses:
        "200":
          description: Finalna lista odbiorcow z oznaczeniem brakow
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Resolution" }
        "400": { $ref: "#/components/responses/Error" }

  /messages/preview:
    post:
      tags: [messages]
      summary: Podsumowanie przed zatwierdzeniem
      description: |
        Liczy wszystko, co wysylajacy widzi przed zatwierdzeniem: dlugosc i kodowanie tresci,
        liczbe czesci SMS na odbiorce (po personalizacji moze sie roznic miedzy osobami),
        liczbe odbiorcow i laczny koszt. Frontend nie liczy czesci SMS sam (frontend/CLAUDE.md).

        Endpoint jest wolany na zywo podczas pisania, dlatego problemy z trescia (pusta tresc,
        nieznany placeholder, brak wartosci u odbiorcy) NIE sa bledem 400, tylko trafiaja do
        odpowiedzi. 400 oznacza zle zbudowane zadanie. Pusty wybor odbiorcow jest dozwolony:
        wtedy liczona jest tylko sama tresc (template), a liczniki odbiorcow sa zerowe.
        Temat nie wplywa na wynik; sprawdza go dopiero tworzenie wsadu.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageDraft" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SendEstimate" }
        "400": { $ref: "#/components/responses/Error" }

  /batches:
    get:
      tags: [batches]
      summary: Historia wysylek (stronicowana)
      description: |
        Od najnowszej. Kazda pozycja to podsumowanie; szczegoly per odbiorca w GET /batches/{id}.
        Wysylajacy widzi swoje wsady, administrator wszystkie (gdy dojdzie iam).
      parameters:
        - in: query
          name: status
          schema: { $ref: "#/components/schemas/BatchStatus" }
        - { in: query, name: limit,  schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchPage" }
        "400": { $ref: "#/components/responses/Error" }
    post:
      tags: [batches]
      summary: Zatwierdza i uruchamia wysylke
      description: |
        Jedno wywolanie = koncowe potwierdzenie wysylajacego (description.md: "masowa wysylka
        powinna wymagac koncowego potwierdzenia"; potwierdzenie to okno w kreatorze po podgladzie
        z POST /messages/preview). Nie ma osobnego szkicu ani /confirm: tresc i wybor sa w zadaniu.

        Przed zapisem cokolwiek, co sprawiloby, ze wysylka padnie w calosci, jest odrzucane:
        pusty temat lub tresc i nieznany placeholder -> 400 invalid_input (pola subject, body);
        wybrana grupa lub osoba juz nie istnieje -> 409 selection_changed (brakujace ID w ids);
        wybor nie daje nikogo -> 422 no_recipients. Problemy pojedynczych odbiorcow (brak kanalu,
        brak imienia) nie blokuja wysylki - trafiaja do statusow tego odbiorcy.

        Idempotency-Key chroni przed podwojnym kliknieciem i ponowieniem zadania przez siec:
        ten sam klucz z ta sama trescia zwraca istniejacy wsad (200) i niczego nie wysyla
        ponownie; ten sam klucz z inna trescia to 409 idempotency_conflict.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          description: Nowy UUID na kazde otwarcie okna potwierdzenia (generuje frontend)
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BatchRequest" }
      responses:
        "202":
          description: Wsad zapisany, wysylka uruchomiona. Status wsadu moze byc jeszcze running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchDetail" }
        "200":
          description: Powtorzone zadanie z tym samym Idempotency-Key - istniejacy wsad, nic nie wyslano ponownie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchDetail" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /batches/{id}:
    get:
      tags: [batches]
      summary: Szczegoly wsadu - status obu kanalow dla kazdego odbiorcy
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchDetail" }
        "404": { $ref: "#/components/responses/Error" }

  /batches/{id}/retry:
    post:
      tags: [batches]
      summary: Ponawia nieudane wiadomosci we wsadzie
      description: Do zdefiniowania osobnym PR-em razem z implementacja ponownej wysylki.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "202": { description: Ponowienie uruchomione }

  /auth/login:
    post:
      tags: [auth]
      summary: Logowanie
      description: |
        Ustawia cookie sesji dys_session (HttpOnly, SameSite=Lax, Secure poza APP_ENV=development),
        waznej 12 godzin. Zly e-mail, zle haslo i zablokowane konto daja te sama odpowiedz 401
        invalid_credentials. Po 5 nieudanych probach dla jednego e-maila w ciagu 15 minut
        odpowiedz to 429 too_many_attempts z naglowkiem Retry-After.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Zalogowano
          headers:
            Set-Cookie: { schema: { type: string }, description: "dys_session=<token>; Path=/; HttpOnly; SameSite=Lax" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /auth/logout:
    post:
      tags: [auth]
      summary: Wylogowanie - konczy sesje z cookie i czysci cookie
      responses:
        "204": { description: Wylogowano }
        "401": { $ref: "#/components/responses/Error" }

  /auth/me:
    get:
      tags: [auth]
      summary: Zalogowany uzytkownik
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Error" }

  /users:
    get:
      tags: [admin]
      summary: Konta uzytkownikow (administratorzy najpierw, potem po nazwisku)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [admin]
      summary: Zaklada konto
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserInput" }
      responses:
        "201":
          description: Utworzono
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /users/{id}:
    patch:
      tags: [admin]
      summary: Zmienia imie i nazwisko, role albo blokade konta
      description: |
        Pominiete pola zostaja bez zmian. Zablokowanie konta konczy wszystkie jego sesje.
        Administrator nie moze zablokowac ani zdegradowac siebie (409 self_lockout), a ostatniego
        aktywnego administratora nie moze zdegradowac ani zablokowac nikt (409 last_admin).
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserChange" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /users/{id}/password:
    put:
      tags: [admin]
      summary: Nadaje nowe haslo i konczy wszystkie sesje tego uzytkownika
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordInput" }
      responses:
        "204": { description: Ustawiono }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /audit:
    get:
      tags: [admin]
      summary: Dziennik zdarzen (audit_log), od najnowszych
      parameters:
        - { in: query, name: limit,  schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditPage" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /admin/config:
    get:
      tags: [admin]
      summary: Konfiguracja wysylki (tylko do odczytu, bez sekretow)
      description: |
        Operatorzy, tryb DRY_RUN, nadawcy, cena SMS i to, czy klucze i webhooki sa ustawione.
        Wartosci kluczy nigdy nie sa zwracane. Zmiana wymaga edycji .env na serwerze, a podlaczenie
        prawdziwego operatora - zgody opiekuna projektu (CLAUDE.md, zasada 3).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SendingConfig" }
        "403": { $ref: "#/components/responses/Error" }

  /stats/sms:
    get:
      tags: [admin]
      summary: Agregacja wykorzystania i kosztow SMS dla panelu administratora
      description: |
        Zwraca sumaryczne statystyki wyslanych wiadomosci SMS, liczbe czesci oraz koszty
        w tysiecznych czesciach zlotego (milli-PLN, 1 gr = 10 milli, 1 PLN = 1000 milli).
        Obsluguje opcjonalne filtrowanie po identyfikatorze wsadu (batch_id) oraz zakresie
        czasowym wysylki (from, to).
        Wymaga roli administratora.
      parameters:
        - in: query
          name: batch_id
          description: Opcjonalny filtr po identyfikatorze wsadu (UUID)
          schema:
            type: string
            format: uuid
        - in: query
          name: from
          description: Poczatek zakresu czasu utworzenia/potwierdzenia wsadu (RFC3339 lub YYYY-MM-DD)
          schema:
            type: string
        - in: query
          name: to
          description: Koniec zakresu czasu utworzenia/potwierdzenia wsadu (RFC3339 lub YYYY-MM-DD; data bez godziny obejmuje caly dzien)
          schema:
            type: string
      responses:
        "200":
          description: Zagregowane statystyki wykorzystania SMS
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SMSUsageStats" }
        "400": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: dys_session
      description: Token sesji z POST /auth/login (ADR-0010)

  schemas:
    Role:
      type: string
      enum: [admin, sender]
      description: admin = odbiorcy, grupy, konta, konfiguracja; sender = tworzenie i wysylka komunikatow

    User:
      type: object
      required: [id, email, fullName, role, disabled, createdAt, lastLoginAt]
      properties:
        id:          { type: string, format: uuid }
        email:       { type: string, description: "Login, zapisany malymi literami" }
        fullName:    { type: string }
        role:        { $ref: "#/components/schemas/Role" }
        disabled:    { type: boolean, description: "Zablokowane konto nie moze sie zalogowac" }
        createdAt:   { type: string, format: date-time }
        lastLoginAt: { type: string, format: date-time, nullable: true }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:    { type: string }
        password: { type: string }

    UserInput:
      type: object
      required: [email, fullName, role, password]
      properties:
        email:    { type: string }
        fullName: { type: string, maxLength: 200 }
        role:     { $ref: "#/components/schemas/Role" }
        password: { type: string, minLength: 12, maxLength: 128 }

    UserChange:
      type: object
      properties:
        fullName: { type: string, maxLength: 200 }
        role:     { $ref: "#/components/schemas/Role" }
        disabled: { type: boolean }

    PasswordInput:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 12, maxLength: 128 }

    AuditEntry:
      type: object
      required: [id, userId, userName, action, entity, entityId, details, createdAt]
      properties:
        id:       { type: integer, format: int64 }
        userId:   { type: string, format: uuid, nullable: true, description: "Kto; przy login_failed - konto, na ktore probowano sie zalogowac" }
        userName: { type: string, nullable: true, description: "Biezace imie i nazwisko userId" }
        action:
          type: string
          description: |
            login, login_failed, logout, user_created, user_updated, password_reset, password_changed;
            inne domeny dopisuja wlasne (np. batch_confirmed) - UI pokazuje nieznane bez zmian
        entity:   { type: string, nullable: true }
        entityId: { type: string, nullable: true }
        details:
          type: object
          additionalProperties: { type: string }
          description: Wartosci zawsze jako tekst; bez danych kontaktowych i tresci wiadomosci
        createdAt: { type: string, format: date-time }

    AuditPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditEntry" }
        total: { type: integer }

    SendingConfig:
      type: object
      required: [dryRun, email, sms]
      properties:
        dryRun: { type: boolean }
        email:
          type: object
          required: [provider, from, sandbox, credentialsSet, eventsWebhook]
          properties:
            provider:       { type: string, description: "mailpit albo sendgrid" }
            from:           { type: string }
            sandbox:        { type: boolean }
            credentialsSet: { type: boolean, description: "Czy klucz/haslo sa ustawione; wartosci nie sa zwracane" }
            eventsWebhook:  { type: boolean, description: "Czy webhook zdarzen SendGrid jest wlaczony" }
        sms:
          type: object
          required: [provider, senderName, testMode, credentialsSet, reportsWebhook, pricePerPartMilli]
          properties:
            provider:          { type: string, description: "fake albo smsapi" }
            senderName:        { type: string }
            testMode:          { type: boolean }
            credentialsSet:    { type: boolean }
            reportsWebhook:    { type: boolean, description: "Czy raporty doreczen SMSAPI sa wlaczone" }
            pricePerPartMilli: { type: integer, format: int64 }

    RecipientType:
      type: string
      enum: [parent, student]

    Recipient:
      type: object
      required: [id, firstName, lastName, type, classes, issues, createdAt, updatedAt]
      properties:
        id:        { type: string, format: uuid }
        firstName: { type: string }
        lastName:  { type: string }
        email:     { type: string, nullable: true }
        phone:     { type: string, nullable: true, description: "E.164" }
        type:      { $ref: "#/components/schemas/RecipientType" }
        classes:
          type: array
          description: |
            Klasy odbiorcy (ADR-0009), posortowane jak grupy klasowe. Uczen: najwyzej jedna
            (jego klasa). Rodzic: dowolnie wiele (klasy dzieci). Pusta tablica = brak klasy.
          items: { $ref: "#/components/schemas/ClassName" }
        groupIds:
          type: array
          description: Grupy wlasne odbiorcy. Tylko w GET /recipients/{id}; systemowe i klasowe wynikaja z type i classes.
          items: { type: string, format: uuid }
        issues:
          type: array
          description: Kanaly, ktorymi nie da sie dotrzec do odbiorcy (pusta = oba kanaly OK)
          items: { $ref: "#/components/schemas/ContactIssue" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    RecipientInput:
      type: object
      required: [firstName, lastName, type]
      description: Co najmniej jedno z email / phone musi byc podane. Pusty string = brak.
      properties:
        firstName: { type: string }
        lastName:  { type: string }
        email:     { type: string, nullable: true }
        phone:     { type: string, nullable: true, description: "Dowolny zapis, normalizowany do E.164" }
        type:      { $ref: "#/components/schemas/RecipientType" }
        classes:
          type: array
          description: |
            Pominiete = bez zmian przy PUT, brak klasy przy POST. Wartosci normalizowane
            (przyciecie, usuniecie spacji, wielkie litery) i deduplikowane. Uczen z wiecej niz
            jedna klasa albo niepoprawna nazwa -> 400 invalid_input, pole "classes".
          items: { type: string }

    RecipientPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Recipient" }
        total: { type: integer, description: "Liczba wszystkich pasujacych, nie tylko na tej stronie" }

    Channel:
      type: string
      enum: [email, sms]

    ContactIssue:
      type: object
      required: [channel, reason]
      properties:
        channel: { $ref: "#/components/schemas/Channel" }
        reason:
          type: string
          enum: [missing, invalid]
          description: missing = brak wartosci, invalid = zapisana wartosc nie przechodzi walidacji

    ClassName:
      type: string
      pattern: "^[0-9][0-9A-Z]{0,5}$"
      description: |
        Znormalizowana nazwa klasy (ADR-0009): cyfra na poczatku, potem wielkie litery lub cyfry,
        1-6 znakow, np. 3A, 1TI, 2BG. Wejscie jest normalizowane przed sprawdzeniem.

    Group:
      type: object
      required: [id, name, description, kind, memberCount]
      properties:
        id:          { type: string, format: uuid }
        name:        { type: string }
        description: { type: string }
        kind:
          type: string
          enum: [system, custom]
          description: |
            system = wyliczana z danych odbiorcow, tylko do odczytu. Obejmuje tez grupy klasowe
            (className != null) - enum sie nie zmienia, wiec dotychczasowi klienci dzialaja bez zmian.
        className:
          type: string
          nullable: true
          pattern: "^[0-9][0-9A-Z]{0,5}$"
          description: |
            Dla grup klasowych ("Uczniowie klasy 3A", "Rodzice uczniow klasy 3A") nazwa klasy, inaczej
            null. ID grupy klasowej jest stale: UUIDv5 z przestrzeni nazw ADR-0009 i "students:3A" /
            "parents:3A", wiec zapisany wybor wskazuje te sama grupe tak dlugo, jak klasa istnieje.
            Format jak ClassName.
        audience:
          type: string
          nullable: true
          enum: [students, parents, null]
          description: Dla grup klasowych - kogo obejmuje; inaczej null. Pozwala UI grupowac liste bez parsowania nazwy.
        memberCount: { type: integer }
        createdAt:   { type: string, format: date-time, nullable: true, description: "null dla grup systemowych" }

    GroupInput:
      type: object
      required: [name]
      properties:
        name:        { type: string, maxLength: 100 }
        description: { type: string, maxLength: 500 }

    MemberIds:
      type: object
      required: [recipientIds]
      properties:
        recipientIds:
          type: array
          minItems: 1
          maxItems: 5000
          items: { type: string, format: uuid }

    MembershipChange:
      type: object
      required: [changed, unchanged]
      properties:
        changed:   { type: integer, description: "Ile osob faktycznie dodano / usunieto" }
        unchanged: { type: integer, description: "Ile juz bylo w grupie (albo juz poza nia)" }

    RecipientSelection:
      type: object
      description: Co najmniej jedno z groupIds / recipientIds musi byc niepuste. Kazda lista najwyzej 5000 ID.
      properties:
        groupIds:
          type: array
          items: { type: string, format: uuid }
        recipientIds:
          type: array
          items: { type: string, format: uuid }
        excludedRecipientIds:
          type: array
          description: Osoby wykluczone z tej jednej wysylki; maja pierwszenstwo przed grupa i wyborem recznym (ADR-0007)
          items: { type: string, format: uuid }

    Resolution:
      type: object
      required: [recipients, unknownGroupIds, unknownRecipientIds, excludedIds, mergedDuplicates, summary]
      properties:
        recipients:
          type: array
          description: Kazda osoba raz, po nazwisku, imieniu i ID
          items: { $ref: "#/components/schemas/ResolvedRecipient" }
        unknownGroupIds:
          type: array
          items: { type: string, format: uuid }
        unknownRecipientIds:
          type: array
          items: { type: string, format: uuid }
        excludedIds:
          type: array
          description: Wykluczeni, ktorzy faktycznie byli w wyborze
          items: { type: string, format: uuid }
        mergedDuplicates: { type: integer, description: "Ile powtorzen scalono (osoba w 2 grupach + recznie = 2)" }
        summary:
          type: object
          required: [total, complete, partial, unreachable]
          properties:
            total:       { type: integer }
            complete:    { type: integer, description: "Osiagalni oboma kanalami" }
            partial:     { type: integer, description: "Dokladnie jednym kanalem - wysylka czesciowa" }
            unreachable: { type: integer, description: "Zadnym kanalem" }

    ResolvedRecipient:
      type: object
      required: [recipient, viaGroupIds, direct, channels]
      properties:
        recipient:   { $ref: "#/components/schemas/Recipient" }
        viaGroupIds:
          type: array
          description: Wybrane grupy, przez ktore osoba trafila na liste, w kolejnosci wyboru
          items: { type: string, format: uuid }
        direct:      { type: boolean, description: "Wybrana takze recznie" }
        channels:
          type: array
          description: Kanaly, ktorymi faktycznie zostanie wyslana (delivery tworzy wiersze tylko dla nich)
          items: { $ref: "#/components/schemas/Channel" }

    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stabilny klucz dla UI
          enum:
            - invalid_request      # nieczytelny JSON / zly parametr
            - invalid_input        # walidacja pol, szczegoly w fields
            - empty_selection      # resolve bez grup i osob
            - not_found
            - duplicate_contact    # e-mail lub telefon uzywany przez innego odbiorce, szczegoly w fields i ids
            - recipient_in_use     # odbiorca jest w historii wysylek
            - name_taken           # nazwa grupy zajeta
            - system_group         # proba zmiany grupy systemowej
            - unknown_recipient    # nieistniejace ID w ids
            - selection_changed    # POST /batches: wybrana grupa lub osoba juz nie istnieje, brakujace ID w ids
            - no_recipients        # POST /batches: wybor nie daje zadnego odbiorcy
            - idempotency_conflict # POST /batches: Idempotency-Key uzyty z inna trescia
            - unauthenticated      # brak waznej sesji (401)
            - forbidden            # rola nie ma dostepu (403)
            - invalid_credentials  # POST /auth/login: zly e-mail, haslo albo konto zablokowane
            - too_many_attempts    # POST /auth/login: za duzo nieudanych prob (429)
            - email_taken          # POST /users: e-mail ma juz inne konto
            - last_admin           # PATCH /users/{id}: ostatni aktywny administrator
            - self_lockout         # PATCH /users/{id}: administrator nie zablokuje ani nie zdegraduje siebie
            - internal
        message: { type: string, description: "Szczegol diagnostyczny po angielsku, nie do wyswietlania wprost" }
        fields:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:   { type: string, description: "Te same klucze co ImportFieldError (first_name, last_name, type, email, phone, contact) oraz name, description, recipientIds[2] ..." }
              message: { type: string }
        ids:
          type: array
          description: ID, ktorych dotyczy blad (duplicate_contact -> istniejacy odbiorca, unknown_recipient i selection_changed -> brakujace)
          items: { type: string, format: uuid }

    MessageDraft:
      type: object
      required: [subject, body]
      properties:
        subject: { type: string, description: "Wylacznie temat e-maila" }
        body:    { type: string, description: "Jedna wspolna tresc dla obu kanalow, wysylana bajt w bajt (bez przycinania)" }
        selection:
          description: Moze byc pominiety albo pusty - wtedy podglad liczy tylko sama tresc
          allOf: [{ $ref: "#/components/schemas/RecipientSelection" }]

    SmsLength:
      type: object
      required: [encoding, units, parts]
      properties:
        encoding: { type: string, enum: [GSM7, UCS2], description: "UCS2 juz przy jednym znaku spoza GSM-7, np. polskiej literze" }
        units:    { type: integer, description: "Dlugosc w septetach (GSM7) albo jednostkach UTF-16 (UCS2)" }
        parts:    { type: integer, description: "Liczba SMS-ow dla jednego odbiorcy; 0 dla pustej tresci" }

    SendEstimate:
      type: object
      required:
        - template
        - placeholders
        - unknownPlaceholders
        - recipientCount
        - emailCount
        - smsCount
        - partialCount
        - unreachableCount
        - ucs2Count
        - minPartsPerRecipient
        - maxPartsPerRecipient
        - totalSmsParts
        - costMilli
        - renderFailedIds
      properties:
        template:
          description: Tresc tak, jak ja wpisano (przed podstawieniem placeholderow)
          allOf: [{ $ref: "#/components/schemas/SmsLength" }]
        placeholders:
          type: array
          description: Nazwy uzytych placeholderow {{nazwa}}, w kolejnosci pierwszego uzycia
          items: { type: string }
        unknownPlaceholders:
          type: array
          description: Uzyte nazwy spoza obslugiwanych (imie, nazwisko). Gdy niepuste albo tresc jest pusta, nic nie jest renderowane - wszystkie liczniki poza recipientCount i koszt sa zerowe.
          items: { type: string }
        recipientCount:   { type: integer, description: "Odbiorcy po deduplikacji i wykluczeniach" }
        emailCount:       { type: integer, description: "Odbiorcy, ktorzy dostana e-mail" }
        smsCount:         { type: integer, description: "Odbiorcy, ktorzy dostana SMS" }
        partialCount:     { type: integer, description: "Osiagalni dokladnie jednym kanalem (wysylka czesciowa)" }
        unreachableCount: { type: integer, description: "Osiagalni zadnym kanalem" }
        ucs2Count:        { type: integer, description: "Odbiorcy SMS, ktorych spersonalizowana tresc wymaga UCS2" }
        minPartsPerRecipient: { type: integer }
        maxPartsPerRecipient: { type: integer }
        totalSmsParts:    { type: integer }
        costMilli:
          type: integer
          format: int64
          description: Szacowany koszt SMS w tysiecznych PLN (1000 = 1 zl), cena z SMS_PRICE_PER_PART_PLN. E-mail jest darmowy.
        renderFailedIds:
          type: array
          description: Odbiorcy bez wartosci dla uzytego placeholdera (np. puste imie). Nie sa wliczani do licznikow SMS/e-mail.
          items: { type: string, format: uuid }

    BatchStatus:
      type: string
      enum: [draft, scheduled, running, done, done_with_errors, cancelled]
      description: |
        running = sa dostawy pending albo sending; done = wszystko wyslane; done_with_errors = co
        najmniej jedna dostawa failed albo odbiorca bez zadnego kanalu. draft, scheduled, cancelled
        sa w schemacie bazy, ale API ich jeszcze nie nadaje.

    DeliveryStatus:
      type: string
      enum: [pending, sending, sent, delivered, failed]
      description: |
        Zmienia sie tylko do przodu. sending po zakonczeniu wysylki = wynik nieznany (przerwane
        w trakcie wywolania operatora); rozstrzyga go raport doreczenia, nie ponowna wysylka.

    BatchRequest:
      type: object
      required: [subject, body, selection]
      properties:
        subject:   { type: string, description: "Wylacznie temat e-maila; niepusty" }
        body:      { type: string, description: "Jedna wspolna tresc, wysylana bajt w bajt; niepusta" }
        selection: { $ref: "#/components/schemas/RecipientSelection" }

    GroupRef:
      type: object
      description: Grupa tak, jak sie nazywala w chwili wysylki (ADR-0009) - historia nie zalezy od tego, czy grupa nadal istnieje
      required: [id, name]
      properties:
        id:   { type: string, format: uuid }
        name: { type: string }

    UserRef:
      type: object
      required: [id, fullName]
      properties:
        id:       { type: string, format: uuid }
        fullName: { type: string }

    BatchSummary:
      type: object
      required: [id, subject, status, createdBy, createdAt, groups, recipientCount, partialCount, failedCount, totalSmsParts, costMilli]
      properties:
        id:        { type: string, format: uuid }
        subject:   { type: string }
        status:    { $ref: "#/components/schemas/BatchStatus" }
        createdBy:
          description: Kto zatwierdzil i uruchomil wysylke
          allOf: [{ $ref: "#/components/schemas/UserRef" }]
        createdAt:  { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true, description: "Gdy status pierwszy raz przestal byc running" }
        groups:
          type: array
          items: { $ref: "#/components/schemas/GroupRef" }
        recipientCount: { type: integer }
        partialCount:   { type: integer, description: "Odbiorcy osiagalni jednym kanalem" }
        failedCount:    { type: integer, description: "Odbiorcy z co najmniej jedna dostawa failed albo bez zadnego kanalu" }
        totalSmsParts:  { type: integer }
        costMilli:      { type: integer, format: int64, description: "Koszt SMS w tysiecznych PLN, wg ceny z chwili wysylki" }

    BatchPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/BatchSummary" }
        total: { type: integer }

    BatchDetail:
      allOf:
        - { $ref: "#/components/schemas/BatchSummary" }
        - type: object
          required: [body, recipientIds, recipients]
          properties:
            body:
              type: string
              description: Tresc przed podstawieniem placeholderow (kopia wsadu startuje od niej)
            recipientIds:
              type: array
              description: Osoby wybrane recznie, poza grupami
              items: { type: string, format: uuid }
            recipients:
              type: array
              description: Ostateczna lista odbiorcow, po nazwisku i imieniu
              items: { $ref: "#/components/schemas/BatchRecipient" }

    BatchRecipient:
      type: object
      description: Bez adresu i numeru - historia pokazuje kto i z jakim skutkiem, nie dane kontaktowe.
      required: [recipientId, firstName, lastName, partial, unreachable, deliveries]
      properties:
        recipientId: { type: string, format: uuid }
        firstName:   { type: string }
        lastName:    { type: string }
        renderedBody:
          type: string
          nullable: true
          description: Tresc, ktora dostala ta osoba (identyczna w obu kanalach); null, gdy nie dalo sie jej wyrenderowac
        partial:     { type: boolean }
        unreachable: { type: boolean }
        deliveries:
          type: array
          description: Jedna pozycja na kanal, ktorym wysylka faktycznie szla (e-mail przed SMS)
          items: { $ref: "#/components/schemas/Delivery" }

    Delivery:
      type: object
      required: [channel, status, parts, attempts]
      properties:
        channel:  { $ref: "#/components/schemas/Channel" }
        status:   { $ref: "#/components/schemas/DeliveryStatus" }
        parts:    { type: integer, description: "Czesci SMS; 1 dla e-maila" }
        attempts: { type: integer }
        error:
          type: string
          nullable: true
          description: 'Krotki sklasyfikowany powod, np. "permanent: invalid recipient"; nigdy surowa odpowiedz operatora'
        updatedAt: { type: string, format: date-time }

    ImportFile:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: |
            CSV (UTF-8, separator , albo ;) lub XLSX (pierwszy arkusz), najwyzej 5 MB i 5000 wierszy.
            Kolumny wymagane: imie, nazwisko, e-mail, telefon, typ. Opcjonalna kolumna klasa (ADR-0009):
            jedna klasa ucznia albo kilka klas rodzica po przecinku, np. "3A, 1B" (w CSV z separatorem
            przecinkiem komorke trzeba ujac w cudzyslow). Plik bez tej kolumny dziala jak dotad.

    ImportReport:
      type: object
      description: Kazdy niepusty wiersz danych jest dokladnie na jednej liscie. row to numer wiersza w pliku (naglowek = 1).
      required: [valid, invalid, duplicates]
      properties:
        valid:
          type: array
          items:
            type: object
            required: [row, recipient]
            properties:
              row:       { type: integer }
              recipient: { $ref: "#/components/schemas/ImportedRecipient" }
        invalid:
          type: array
          items:
            type: object
            required: [row, errors]
            properties:
              row: { type: integer }
              errors:
                type: array
                items: { $ref: "#/components/schemas/ImportFieldError" }
        duplicates:
          type: array
          items:
            type: object
            required: [row, field]
            description: Dokladnie jedno z duplicateOfRow / existingRecipientId jest ustawione.
            properties:
              row:   { type: integer }
              field: { type: string, enum: [email, phone] }
              duplicateOfRow:      { type: integer, description: "Wczesniejszy wiersz pliku z ta sama wartoscia" }
              existingRecipientId: { type: string, format: uuid, description: "Zapisany odbiorca z ta sama wartoscia" }

    ImportedRecipient:
      type: object
      required: [firstName, lastName, type, classes]
      properties:
        firstName: { type: string }
        lastName:  { type: string }
        email:     { type: string, nullable: true }
        phone:     { type: string, nullable: true, description: "E.164" }
        type:      { $ref: "#/components/schemas/RecipientType" }
        classes:
          type: array
          description: Znormalizowane klasy z kolumny klasa; pusta tablica, gdy kolumny brak albo komorka jest pusta
          items: { $ref: "#/components/schemas/ClassName" }

    ImportFieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          enum: [first_name, last_name, type, email, phone, classes, contact, encoding, row]
          description: |
            Stabilny klucz dla UI (contact = brak e-maila i telefonu, row = wiersza nie da sie odczytac,
            classes = niepoprawna nazwa klasy albo uczen z wiecej niz jedna klasa)
        message: { type: string, description: "Szczegol diagnostyczny po angielsku, nie do wyswietlania wprost" }

    ImportFileErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [invalid_request, missing_file, empty_file, missing_columns, invalid_header, unsupported_format, file_too_large, too_many_rows, unclosed_quote, internal]
        message: { type: string, description: "Szczegol diagnostyczny po angielsku, np. lista brakujacych kolumn" }

    SMSUsageStats:
      type: object
      description: |
        Zagregowane statystyki wykorzystania i kosztow SMS.
        plannedCostMilli to koszt zaplanowany (wszystkie czesci SMS).
        billedCostMilli to koszt faktycznie rozliczonych SMS-ow przez bramke (przekazanych do operatora: sent + delivered oraz failed z nadanym provider_message_id; nie obejmuje bledow odrzuconych przed przyjeciem do sieci).
      required:
        - pricePerPartMilli
        - totalMessages
        - totalParts
        - plannedCostMilli
        - billedCostMilli
        - deliveredMessages
        - deliveredParts
        - deliveredCostMilli
        - sentMessages
        - sentParts
        - failedMessages
        - failedParts
        - inFlightMessages
        - inFlightParts
      properties:
        pricePerPartMilli:
          type: integer
          format: int64
          description: Biezaca cena jednostkowa za jedna czesc SMS w tysiecznych czesciach PLN (np. 80 = 0.08 PLN)
        totalMessages:
          type: integer
          description: Laczna liczba zaplanowanych wiadomosci SMS
        totalParts:
          type: integer
          description: Laczna liczba zaplanowanych czesci SMS
        plannedCostMilli:
          type: integer
          format: int64
          description: Przewidywany / zaplanowany koszt wszystkich czesci SMS w milli-PLN
        billedCostMilli:
          type: integer
          format: int64
          description: Koszt czesci SMS faktycznie rozliczonych przez bramke (sent + delivered oraz failed z provider_message_id) w milli-PLN
        deliveredMessages:
          type: integer
          description: Liczba doreczonych wiadomosci SMS (status delivered)
        deliveredParts:
          type: integer
          description: Liczba doreczonych czesci SMS
        deliveredCostMilli:
          type: integer
          format: int64
          description: Koszt doreczonych czesci SMS w milli-PLN
        sentMessages:
          type: integer
          description: Liczba wiadomosci wyslanych, oczekujacych na raport doreczenia (status sent)
        sentParts:
          type: integer
          description: Liczba czesci wyslanych, oczekujacych na raport
        failedMessages:
          type: integer
          description: Liczba niedoreczonych wiadomosci SMS (status failed)
        failedParts:
          type: integer
          description: Liczba niedoreczonych czesci SMS
        inFlightMessages:
          type: integer
          description: Liczba wiadomosci w trakcie przetwarzania (status pending lub sending)
        inFlightParts:
          type: integer
          description: Liczba czesci wiadomosci w trakcie przetwarzania

  responses:
    Error:
      description: Blad z kodem z ErrorBody.code
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }

    ImportFileError:
      description: |
        Pliku nie da sie uzyc jako calosci (pojedyncze zle wiersze trafiaja do raportu, nie tutaj).
        400 = invalid_request (to nie multipart) albo missing_file (brak pola file),
        413 = file_too_large, 500 = internal (blad bazy; nic nie zapisano), 422 = pozostale kody.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ImportFileErrorBody" }
