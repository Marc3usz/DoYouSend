name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            gofmt -l .
            echo "Niesformatowane pliki - uruchom make fmt"
            exit 1
          fi
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -race

  # golangci-lint (konfiguracja: backend/.golangci.yml). Na razie zglasza tylko uwagi w zmienionych
  # liniach: istniejacy kod ma ~60 uwag, glownie revive o komentarzach - do sprzatniecia osobno.
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: backend/go.sum
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1.6
          working-directory: backend
          only-new-issues: true

  # Testy z tagiem `integration` (stores na Postgresie, SQL). Bez bazy dbtest je pomija,
  # wiec job nie przechodzi, jesli ktorykolwiek test zostal pominiety z braku URL.
  backend-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: doyousend
          POSTGRES_PASSWORD: doyousend
          POSTGRES_DB: doyousend
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U doyousend"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://doyousend:doyousend@localhost:5432/doyousend?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: backend/go.sum
      - name: go test -tags integration
        run: |
          set -o pipefail
          go test -tags integration -count=1 -race -v ./... | tee "$RUNNER_TEMP/integration.log"
          if grep -q "TEST_DATABASE_URL is not set" "$RUNNER_TEMP/integration.log"; then
            echo "::error::Testy integracyjne zostaly pominiete - brak polaczenia z baza"
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run build
      - run: npm run test

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # .env w repo, klucze (takze w formacie SendGrid/Notion), adresy e-mail spoza
      # @example.test i numery spoza +48 500 100 1NN - w calym repo, lacznie z docs/.
      - name: Sekrety i dane kontaktowe spoza puli testowej
        run: bash scripts/check-secrets.sh
