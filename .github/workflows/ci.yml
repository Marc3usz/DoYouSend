name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          # Wlaczyc cache, gdy pojawi sie backend/go.sum (pierwsza zaleznosc).
          cache: false
      - name: gofmt
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            gofmt -l .
            echo "Niesformatowane pliki - uruchom make fmt"
            exit 1
          fi
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -race

  # Testy z tagiem `integration` (stores na Postgresie, SQL). Bez bazy dbtest je pomija,
  # wiec job nie przechodzi, jesli ktorykolwiek test zostal pominiety z braku URL.
  backend-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: doyousend
          POSTGRES_PASSWORD: doyousend
          POSTGRES_DB: doyousend
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U doyousend"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://doyousend:doyousend@localhost:5432/doyousend?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: go test -tags integration
        run: |
          set -o pipefail
          go test -tags integration -count=1 -race -v ./... | tee "$RUNNER_TEMP/integration.log"
          if grep -q "TEST_DATABASE_URL is not set" "$RUNNER_TEMP/integration.log"; then
            echo "::error::Testy integracyjne zostaly pominiete - brak polaczenia z baza"
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run build
      - run: npm run test

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Plik .env nie moze byc w repo
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env jest w repozytorium - usun go i uniewaznij klucze"
            exit 1
          fi
      - name: Szukanie kluczy i danych kontaktowych spoza domeny testowej
        run: |
          pattern='(api[_-]?key|secret|password|token)\s*[:=]\s*["'"'"']?[A-Za-z0-9_\-]{16,}'
          if git grep -nIE "$pattern" -- . ':!.env.example' ':!docs/**' ':!*.md'; then
            echo "::error::Mozliwy sekret w repozytorium - przenies go do .env"
            exit 1
          fi
          echo "Brak podejrzanych wartosci."
