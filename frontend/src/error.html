<!doctype html>
<html lang="pl">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="/favicon.svg" />
		<title>%sveltekit.status% — DoYouSend</title>
		<!--
			Fallback page for errors SvelteKit cannot render with the app layout, e.g.
			the 403 that hooks.server.ts returns for an admin page opened by a sender.
			Self-contained: no app CSS or JS is available here.
		-->
		<style>
			:root {
				--bg: #f5f7fa;
				--surface: #ffffff;
				--text: #1c2430;
				--muted: #556171;
				--border: #d5dbe3;
				--primary: #1d4ed8;
				color-scheme: light dark;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #0f141b;
					--surface: #171d26;
					--text: #e6eaf0;
					--muted: #9aa6b6;
					--border: #2b3544;
					--primary: #7aa2ff;
				}
			}
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				background: var(--bg);
				color: var(--text);
				font-family:
					system-ui,
					-apple-system,
					'Segoe UI',
					Roboto,
					sans-serif;
			}
			main {
				max-width: 28rem;
				margin: 1rem;
				padding: 2rem;
				background: var(--surface);
				border: 1px solid var(--border);
				border-radius: 12px;
			}
			.status {
				color: var(--muted);
				font-size: 0.875rem;
				margin: 0;
			}
			h1 {
				font-size: 1.375rem;
				margin: 0.25rem 0 1.25rem;
			}
			a {
				color: var(--primary);
				font-weight: 600;
			}
			nav {
				display: flex;
				flex-wrap: wrap;
				gap: 1rem;
			}
		</style>
	</head>
	<body>
		<main>
			<p class="status">Błąd %sveltekit.status%</p>
			<h1>%sveltekit.error.message%</h1>
			<nav>
				<a href="/">Wróć na stronę główną</a>
			</nav>
		</main>
	</body>
</html>
